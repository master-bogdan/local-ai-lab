services:
  ollama:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${LOCAL_AI_DATA_DIR:?LOCAL_AI_DATA_DIR is required}/models/ollama:/root/.ollama
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  comfyui:
    image: local-ai-lab/comfyui-cuda:0.29.0
    build:
      context: ./comfy
      dockerfile: Dockerfile.cuda
    restart: "no"
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - ${LOCAL_AI_DATA_DIR:?LOCAL_AI_DATA_DIR is required}/models/comfyui:/workspace/ComfyUI/models
      - ${LOCAL_AI_DATA_DIR:?LOCAL_AI_DATA_DIR is required}/services/comfyui/output:/workspace/ComfyUI/output
      - ${LOCAL_AI_DATA_DIR:?LOCAL_AI_DATA_DIR is required}/services/comfyui/input:/workspace/ComfyUI/input
    gpus: all
